name: Compilar APK

on:
  push:
    branches: [ "panel-gamer" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK instalable
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK (liviano)
        run: gradle assembleRelease --no-daemon

      - name: Guardar APK como archivo del build
        uses: actions/upload-artifact@v4
        with:
          name: Panel-Gamer-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK en Releases (para bajarlo desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PanelGamer.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest PanelGamer.apk \
            --target "${{ github.sha }}" \
            --title "Panel Gamer (APK)" \
            --notes "APK instalable. Descarga PanelGamer.apk, ábrelo y acepta instalar de origen desconocido."
