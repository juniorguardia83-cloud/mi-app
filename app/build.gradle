plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gamerpanel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gamerpanel'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // APK pequeño y rápido: R8 quita lo que sobra.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmado con la llave debug para que se pueda instalar directo.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
